name: Site Uptime Check

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 Philippine Time daily
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site responds
        run: |
          curl -fsS --max-time 20 "https://agencyfinder.netlify.app/" > /dev/null
          echo "Site responded successfully."
