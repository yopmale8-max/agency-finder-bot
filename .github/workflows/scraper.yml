name: Run Agency Scraper Daily

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Choose a real scrape or a safe email-only test
        required: true
        type: choice
        options:
          - scrape
          - email-test
        default: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google credentials
        if: inputs.run_mode != 'email-test'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python -c "import os; from pathlib import Path; Path('credentials.json').write_text(os.environ['GOOGLE_CREDENTIALS'], encoding='utf-8')"

      - name: Run scraper or email test
        id: scraper
        continue-on-error: true
        timeout-minutes: 20
        env:
          RUN_MODE: ${{ inputs.run_mode || 'scrape' }}
          AGENCY_FINDER_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          AGENCY_FINDER_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AGENCY_FINDER_SMTP_FROM: ${{ secrets.SMTP_FROM }}
          AGENCY_FINDER_SMTP_TO: ${{ secrets.SMTP_TO }}
          AGENCY_FINDER_SMTP_HOST: ${{ vars.SMTP_HOST }}
          AGENCY_FINDER_SMTP_PORT: ${{ vars.SMTP_PORT }}
          MAX_FAILURE_RATE: ${{ vars.MAX_FAILURE_RATE }}
        run: |
          if [ "$RUN_MODE" = "email-test" ]; then
            python -u scraper.py --email-test
          else
            python -u scraper.py
          fi

      - name: Ping Apps Script watchdog
        id: watchdog
        if: steps.scraper.outcome == 'success' && inputs.run_mode != 'email-test'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APP_SHARED_KEY: ${{ secrets.APP_SHARED_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "${APPS_SCRIPT_URL}?action=runWatchdog&key=${APP_SHARED_KEY}"

      - name: Add result to summary
        if: always()
        env:
          SCRAPER_OUTCOME: ${{ steps.scraper.outcome }}
          WATCHDOG_OUTCOME: ${{ steps.watchdog.outcome }}
          RUN_MODE: ${{ inputs.run_mode || 'scheduled scrape' }}
        run: |
          {
            echo "## Agency Finder daily scraper"
            echo "- Run mode: ${RUN_MODE}"
            echo "- Scraper/email outcome: ${SCRAPER_OUTCOME:-not started}"
            echo "- Apps Script watchdog outcome: ${WATCHDOG_OUTCOME:-not run}"
            echo "- Detailed logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark scraper or email failure
        if: steps.scraper.outcome == 'failure'
        run: exit 1
